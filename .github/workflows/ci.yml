name: CI/CD Pipeline

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build image
        run: docker build -t ghcr.io/${{ github.repository }}/file-scanner:latest .

      - name: Push image
        run: docker push ghcr.io/${{ github.repository }}/file-scanner:latest

      - name: Run tests
        run: |
          docker run -d -p 5000:5000 --name scanner-test ghcr.io/${{ github.repository }}/file-scanner:latest
          sleep 3
          docker exec scanner-test python test_scanner.py
          docker rm -f scanner-test
