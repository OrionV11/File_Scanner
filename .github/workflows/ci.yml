name: CI/CD Pipeline

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Build image
        run: docker build -t file-scanner:latest .

      - name: Run tests
        run: |
          docker run -d -p 5000:5000 --name scanner-test file-scanner:latest
          sleep 3
          docker exec scanner-test python test_scanner.py
          docker rm -f scanner-test
