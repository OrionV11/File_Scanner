name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build Docker image
        run: docker build -t file-scanner .

      - name: Start container
        run: |
          docker run -d -p 5000:5000 --name scanner-test file-scanner
          sleep 3

      - name: Run tests
        run: docker exec scanner-test python test_scanner.py

      - name: Cleanup
        run: docker rm -f scanner-test
