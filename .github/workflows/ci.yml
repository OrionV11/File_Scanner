name: CI/CD Pipeline

on:
  push:
    branches: [main]
    tags:
      - "v*"

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t file-scanner:latest .

      - name: Run tests
        run: |
          docker run -d -p 5000:5000 --name scanner-test file-scanner:latest
          sleep 3
          docker exec scanner-test python test_scanner.py
          docker rm -f scanner-test
        # If tests fail → workflow stops automatically (NO-GO)

      - name: Save Docker image
        run: docker save file-scanner:latest -o file-scanner.tar

      - name: Generate checksum
        run: sha256sum file-scanner.tar > file-scanner.tar.sha256

      - name: Import GPG key
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import

      - name: Sign artifact
        run: |
          echo "${{ secrets.GPG_PASSPHRASE }}" | \
          gpg --batch --yes \
              --pinentry-mode loopback \
              --passphrase-fd 0 \
              --detach-sign --armor file-scanner.tar

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.ref_name }}
          path: |
            file-scanner.tar
            file-scanner.tar.sha256
            file-scanner.tar.asc
