<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Upload</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1f35b3 0%, #701bb1 100%);
            min-height: 100vh;
            padding: 0;
        }

        .container {
            background: white;
            padding: 40px 60px;
            width: 100%;
            max-width: 100%;
            min-height: 100vh;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
        }

        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 60px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #f8f9ff;
        }

        .upload-area:hover {
            background: #eef1ff;
            border-color: #764ba2;
        }

        .upload-area.dragover {
            background: #e0e7ff;
            border-color: #4f46e5;
        }

        .upload-text {
            color: #667eea;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .upload-subtext {
            color: #888;
            font-size: 14px;
        }

        input[type="file"] {
            display: none;
        }

        .file-list {
            margin-top: 30px;
        }

        .file-list h2 {
            color: #333;
            font-size: 20px;
            margin-bottom: 15px;
        }

        .file-item {
            background: #f8f9ff;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s ease;
            border-left: 4px solid #ccc;
        }

        .file-item:hover {
            background: #eef1ff;
            transform: translateX(5px);
        }

        .file-item.clean {
            border-left-color: #28a745;
        }

        .file-item.infected {
            border-left-color: #dc3545;
        }

        .file-item.rejected {
            border-left-color: #ffc107;
        }

        .file-item.unknown {
            border-left-color: #aaa;
        }

        .file-info {
            display: flex;
            align-items: center;
            gap: 15px;
            flex: 1;
        }

        .file-icon {
            font-size: 28px;
        }

        .file-details {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .file-name {
            color: #333;
            font-weight: 600;
            margin-bottom: 2px;
            font-size: 15px;
        }

        .file-meta {
            color: #888;
            font-size: 12px;
        }

        .file-sha {
            color: #aaa;
            font-size: 11px;
            font-family: 'Courier New', monospace;
        }

        .scan-badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: white;
        }

        .scan-badge.clean     { background: #28a745; }
        .scan-badge.infected  { background: #dc3545; }
        .scan-badge.rejected  { background: #ffc107; color: #333; }
        .scan-badge.unknown   { background: #aaa; }

        .scan-info-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 2px;
        }

        .btn {
            color: white;
            border: none;
            border-radius: 5px;
            padding: 8px 15px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 14px;
        }

        .btn:hover {
            transform: scale(1.05);
        }

        .btn-report {
            background: #667eea;
        }

        .btn-report:hover {
            background: #5a6fd6;
        }

        .btn-remove {
            background: #ff4757;
        }

        .btn-remove:hover {
            background: #ff3838;
        }

        .btn-group {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }

        .empty-state {
            text-align: center;
            color: #888;
            padding: 20px;
            font-style: italic;
        }

        .status-message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
            display: none;
        }

        .status-message.success {
            background: #d4edda;
            color: #155724;
        }

        .status-message.error {
            background: #f8d7da;
            color: #721c24;
        }

        /* Summary bar */
        .summary-bar {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            padding: 15px 20px;
            background: #f8f9ff;
            border-radius: 10px;
            flex-wrap: wrap;
        }

        .summary-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 600;
        }

        .summary-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: white;
            border-radius: 15px;
            padding: 30px;
            max-width: 650px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        }

        .modal h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 20px;
        }

        .modal-filename {
            color: #667eea;
            font-size: 13px;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .report-content {
            background: #f8f9ff;
            padding: 20px;
            border-radius: 10px;
            font-size: 13px;
            white-space: pre-wrap;
            color: #333;
            line-height: 1.6;
            font-family: 'Courier New', monospace;
            border-left: 4px solid #667eea;
        }

        .modal-footer {
            margin-top: 20px;
            display: flex;
            justify-content: flex-end;
        }

        .modal-close {
            padding: 10px 25px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .modal-close:hover {
            background: #5a6fd6;
            transform: translateY(-1px);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📁 File Upload & Scanner</h1>

        <div class="upload-area" id="uploadArea">
            <div class="upload-text">Click to upload files</div>
            <div class="upload-subtext">or drag and drop files here</div>
        </div>

        <input type="file" id="fileInput" multiple>

        <div id="statusMessage" class="status-message"></div>

        <div class="file-list">
            <h2>Uploaded Files</h2>

            <!-- Summary bar -->
            <div class="summary-bar" id="summaryBar" style="display:none;">
                <div class="summary-item">
                    <div class="summary-dot" style="background:#28a745;"></div>
                    <span id="countClean">0 Clean</span>
                </div>
                <div class="summary-item">
                    <div class="summary-dot" style="background:#dc3545;"></div>
                    <span id="countInfected">0 Infected</span>
                </div>
                <div class="summary-item">
                    <div class="summary-dot" style="background:#ffc107;"></div>
                    <span id="countRejected">0 Rejected</span>
                </div>
                <div class="summary-item">
                    <div class="summary-dot" style="background:#aaa;"></div>
                    <span id="countUnknown">0 Unknown</span>
                </div>
            </div>

            <div id="fileListContainer">
                <div class="empty-state">No files uploaded yet</div>
            </div>
        </div>
    </div>
    
    <!-- Real-time Alerts -->
    <div id="alertsContainer" style="margin: 25px 0; font-family: Arial, sans-serif;"></div>

    <!-- Quarantine Section -->
    <section style="margin-top: 50px; padding: 20px; border-top: 2px solid #ccc;">
        <h2>Quarantined Files (High Risk)</h2>
        <div id="quarantineContainer">
            <p style="color: #666;">No files in quarantine yet.</p>
        </div>
    </section>

    <!-- Admind toggle / Levels of access -->
    <button id="adminButton" style="position: fixed; top: 20px; right: 20px; padding: 10px 15px; background: #0d6efd; color: white; border: none; border-radius: 5px; cursor: pointer; z-index: 1000;">
        Admin Mode: Off
    </button>
    
    <!-- Report Modal -->
    <div id="reportModal" class="modal-overlay">
        <div class="modal">
            <h2>🔍 Scan Report</h2>
            <div id="reportFilename" class="modal-filename"></div>
            <pre id="reportContent" class="report-content">Loading...</pre>
            <div class="modal-footer">
                <button class="modal-close" onclick="closeReport()">Close</button>
            </div>
        </div>
    </div>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const fileListContainer = document.getElementById('fileListContainer');
        const statusMessage = document.getElementById('statusMessage');

        uploadArea.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => handleFiles(e.target.files));

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('dragover'));

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            handleFiles(e.dataTransfer.files);
        });

        async function handleFiles(files) {
            const formData = new FormData();
            for (let file of files) {
                formData.append('files', file);
            }

            try {
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();

                if (response.ok) {
                    showStatus('Files uploaded and scanned successfully!', 'success');

                    //trigger alerts and quarantine based on the scan results
                    result.files.forEach(file => {
                        // remember to adjust keys based on actual response 
                        const scan = file.scan_result || file.scan || {};
                        const stats = scan.last_analysis_stats || {};
                        const malicious = stats.malicious || 0;
                        const suspicious = stats.suspicious || 0;
                        const bad = malicious + suspicious;

                        let severity = 'safe';
                        let message = 'Scan complete - file appears clean.';

                        if (bad > 10 || malicious > 5 || scan.status === 'infected' || file.local_scan === 'infected') {
                            severity = 'high';
                            message = 'HIGH RISK DETECTED! Possible malware/cryptodrainer. Do NOT open or execute.';
                        } else if (bad > 2 || file.local_scan === 'infected') {
                            severity = 'medium';
                            message = 'Medium risk - suspicious detections found.';
                        } else if (bad > 0) {
                            severity = 'low';
                            message = 'Low risk - minor detections, review report.';
                        }

                        showAlert(file.filename || file.name, severity, message);
                    });

                    loadUploadedFiles();
                } else {
                    showStatus(result.error || 'Upload failed', 'error');
                }
            } catch (error) {
                showStatus('Upload failed: ' + error.message, 'error');
            }

            fileInput.value = '';
        }

        async function loadUploadedFiles() {
            try {
                const response = await fetch('/files');
                const files = await response.json();
                displayFiles(files);
            } catch (error) {
                console.error('Error loading files:', error);
            }
        }

        function displayFiles(files) {
            if (files.length === 0) {
                fileListContainer.innerHTML = '<div class="empty-state">No files uploaded yet</div>';
                document.getElementById('summaryBar').style.display = 'none';
                return;
            }

            // Count scan statuses for summary bar
            const counts = { clean: 0, infected: 0, rejected: 0, unknown: 0 };

            fileListContainer.innerHTML = '';

            files.forEach((file) => {
                const scan = file.scan || {};
                const localScan = scan.local_scan || (scan.status === 'rejected' ? 'rejected' : 'unknown');
                const statusKey = ['clean','infected','rejected'].includes(localScan) ? localScan : 'unknown';
                counts[statusKey]++;

                const fileItem = document.createElement('div');
                fileItem.className = `file-item ${statusKey}`;

                const icon = getFileIcon(file.name);
                const size = formatFileSize(file.size);
                const sha = scan.sha256
                    ? `${scan.sha256.substring(0, 20)}...`
                    : null;

                const sigCount = scan.signatures?.length || 0;
                const sigText = statusKey === 'infected'
                    ? `⚠️ ${sigCount} signature${sigCount !== 1 ? 's' : ''} matched`
                    : '';

                fileItem.innerHTML = `
                    <div class="file-info">
                        <div class="file-icon">${icon}</div>
                        <div class="file-details">
                            <div class="file-name">${file.name}</div>
                            <div class="file-meta">${size}${sha ? ` &nbsp;|&nbsp; <span class="file-sha">SHA256: ${sha}</span>` : ''}</div>
                            <div class="scan-info-row">
                                <span class="scan-badge ${statusKey}">${statusKey}</span>
                                ${sigText ? `<span style="color:#dc3545; font-size:12px;">${sigText}</span>` : ''}
                                ${scan.reason ? `<span style="color:#888; font-size:12px;">${scan.reason}</span>` : ''}
                            </div>
                        </div>
                    </div>
                    <div class="btn-group">
                        <button class="btn btn-report" onclick="viewReport('${file.name}')">Report</button>
                        <button class="btn btn-remove" onclick="removeFile('${file.name}')">Remove</button>
                    </div>
                `;

                fileListContainer.appendChild(fileItem);
            });

            // Update summary bar
            document.getElementById('summaryBar').style.display = 'flex';
            document.getElementById('countClean').textContent    = `${counts.clean} Clean`;
            document.getElementById('countInfected').textContent = `${counts.infected} Infected`;
            document.getElementById('countRejected').textContent = `${counts.rejected} Rejected`;
            document.getElementById('countUnknown').textContent  = `${counts.unknown} Unknown`;
        }

        async function viewReport(filename) {
            const modal = document.getElementById('reportModal');
            const content = document.getElementById('reportContent');
            const filenameEl = document.getElementById('reportFilename');

            content.textContent = 'Loading...';
            filenameEl.textContent = filename;
            modal.classList.add('active');

            try {
                const response = await fetch(`/report/${encodeURIComponent(filename)}`);
                if (!response.ok) {
                    content.textContent = 'Report not found for this file.';
                    return;
                }
                content.textContent = await response.text();
            } catch (error) {
                content.textContent = 'Failed to load report: ' + error.message;
            }
        }

        function closeReport() {
            document.getElementById('reportModal').classList.remove('active');
            document.getElementById('reportContent').textContent = '';
            document.getElementById('reportFilename').textContent = '';
        }

        document.getElementById('reportModal').addEventListener('click', function(e) {
            if (e.target === this) closeReport();
        });

        async function removeFile(filename) {
            try {
                const response = await fetch(`/delete/${encodeURIComponent(filename)}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    showStatus('File deleted successfully', 'success');
                    loadUploadedFiles();
                } else {
                    showStatus('Failed to delete file', 'error');
                }
            } catch (error) {
                showStatus('Delete failed: ' + error.message, 'error');
            }
        }

        function getFileIcon(filename) {
            const ext = filename.split('.').pop().toLowerCase();
            const icons = {
                'pdf': '📄', 'doc': '📝', 'docx': '📝',
                'xls': '📊', 'xlsx': '📊',
                'jpg': '🖼️', 'jpeg': '🖼️', 'png': '🖼️', 'gif': '🖼️',
                'mp4': '🎬', 'avi': '🎬', 'mov': '🎬',
                'mp3': '🎵', 'wav': '🎵',
                'zip': '🗜️', 'rar': '🗜️',
                'txt': '📃', 'py': '🐍', 'csv': '📊'
            };
            return icons[ext] || '📎';
        }

        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
        }

        function showStatus(message, type) {
            statusMessage.textContent = message;
            statusMessage.className = `status-message ${type}`;
            statusMessage.style.display = 'block';
            setTimeout(() => { statusMessage.style.display = 'none'; }, 3000);
        }

        loadUploadedFiles();
    </script>

    <script>
        
        let isAdmin = false;
        
        // Admin toggle
        document.getElementById('adminButton').addEventListener('click', function() {
            isAdmin = !isAdmin;
            this.textContent = isAdmin ? 'Admin Mode: On' : 'Admin Mode: Off';
            const quarantineSection = document.getElementById('quarantineContainer').parentElement;
            quarantineSection.style.display = isAdmin ? 'block' : 'none';
        });

        //show alert with severity
        function showAlert(filename, severity, message) {
            const container = document.getElementById('alertsContainer');

            let bgColor = '#d4edda';     // safe
            let borderColor = '#198754'; // green
            let textColor = '#0f5132';
            let title = 'SAFE';

            if (severity === 'high') {
                bgColor = '#f8d7da';
                borderColor = '#dc3545';
                textColor = '#842029';
                title = 'HIGH RISK!';
            } else if (severity === 'medium') {
                bgColor = '#fff3cd';
                borderColor = '#ffc107';
                textColor = '#664d03';
                title = 'MEDIUM RISK';
            } else if (severity === 'low') {
                bgColor = '#fff3cd';
                borderColor = '#fd7e14';
                textColor = '#664d03';
                title = 'LOW RISK';
            }

            const alertDiv = document.createElement('div');
            alertDiv.style.background = bgColor;
            alertDiv.style.border = '3px solid ' + borderColor;
            alertDiv.style.color = textColor;
            alertDiv.style.padding = '16px';
            alertDiv.style.margin = '12px 0';
            alertDiv.style.borderRadius = '6px';

            alertDiv.innerHTML = `
                <strong style="font-size: 1.2em;">${title} - ${filename}</strong><br>
                ${message}<br>
                <small>Severity: ${severity.toUpperCase()}</small>
            `;

            container.appendChild(alertDiv);
            container.scrollIntoView({ behavior: 'smooth' });

            //quarantine high risk
            if (severity === 'high') {
              addToQuarantine(filename);
            }
        }

        //quarantine list
        let quarantinedFiles = [];

        function addToQuarantine(filename) {
            if (!quarantinedFiles.includes(filename)) {
                quarantinedFiles.push(filename);
                updateQuarantine();
            }
        }

        function updateQuarantine() {
            const container = document.getElementById('quarantineContainer');

            if (quarantinedFiles.length === 0) {
                container.innerHTML = '<p style="color: #666;">No files in quarantine yet.</p>';
                return;
            }

            container.innerHTML = '';

            quarantinedFiles.forEach(function(file) {
                const item = document.createElement('div');
                item.style.padding = '12px';
                item.style.background = '#f8f9fa';
                item.style.margin = '8px 0';
                item.style.borderRadius = '6px';

                item.innerHTML = `
                    <strong>${file}</strong> – Quarantined (High Risk)
                    <button onclick="recoverFile('${file}')" style="margin-left:15px; padding:6px 12px; background:#198754; color:white; border:none; border-radius:4px; cursor:pointer;">Recover</button>
                    <button onclick="deleteFile('${file}')" style="margin-left:8px; padding:6px 12px; background:#dc3545; color:white; border:none; border-radius:4px; cursor:pointer;">Delete</button>
                `;

                container.appendChild(item);
            });
        }

        function recoverFile(filename) {
            if (confirm('Recover ' + filename + '?')) {
                quarantinedFiles = quarantinedFiles.filter(f => f !== filename);
                updateQuarantine();
                alert('Recovered ' + filename + ' (backend to be added)');
            }
        }

        function deleteFile(filename) {
            if (confirm('Delete ' + filename + ' permanently?')) {
                quarantinedFiles = quarantinedFiles.filter(f => f !== filename);
                updateQuarantine();
                alert('Deleted ' + filename + ' (backend to be added)');
            }
        }

    </script>
    
</body>
</html>
