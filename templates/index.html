<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Upload</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh; 
        }

        .container {
            background: white;
            border-radius: 0;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px 60px;
            width: 100%;
            max-width: 100%;
            min-height: 100vh;
            margin: 0;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
        }

        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 60px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #f8f9ff;
        }

        .upload-area:hover {
            background: #eef1ff;
            border-color: #764ba2;
        }

        .upload-area.dragover {
            background: #e0e7ff;
            border-color: #4f46e5;
        }

        .upload-text {
            color: #667eea;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .upload-subtext {
            color: #888;
            font-size: 14px;
        }

        input[type="file"] {
            display: none;
        }

        .file-list {
            margin-top: 30px;
        }

        .file-list h2 {
            color: #333;
            font-size: 20px;
            margin-bottom: 15px;
        }

        .file-item {
            background: #f8f9ff;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s ease;
        }

        .file-item:hover {
            background: #eef1ff;
            transform: translateX(5px);
        }

        .file-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .file-icon {
            font-size: 24px;
        }

        .file-details {
            display: flex;
            flex-direction: column;
        }

        .file-name {
            color: #333;
            font-weight: 600;
            margin-bottom: 3px;
        }

        .file-size {
            color: #888;
            font-size: 12px;
        }

        .btn {
            color: white;
            border: none;
            border-radius: 5px;
            padding: 8px 15px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 14px;
        }

        .btn:hover {
            transform: scale(1.05);
        }

        .btn-report {
            background: #667eea;
        }

        .btn-report:hover {
            background: #5a6fd6;
        }

        .btn-remove {
            background: #ff4757;
        }

        .btn-remove:hover {
            background: #ff3838;
        }

        .btn-group {
            display: flex;
            gap: 8px;
        
        }

        .empty-state {
            text-align: center;
            color: #888;
            padding: 20px;
            font-style: italic;
        }

        .status-message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
            display: none;
        }

        .status-message.success {
            background: #d4edda;
            color: #155724;
        }

        .status-message.error {
            background: #f8d7da;
            color: #721c24;
        }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: white;
            border-radius: 15px;
            padding: 30px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        }

        .modal h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 20px;
        }

        .modal-filename {
            color: #667eea;
            font-size: 13px;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .report-content {
            background: #f8f9ff;
            padding: 20px;
            border-radius: 10px;
            font-size: 13px;
            white-space: pre-wrap;
            color: #333;
            line-height: 1.6;
            font-family: 'Courier New', monospace;
            border-left: 4px solid #667eea;
        }

        .modal-footer {
            margin-top: 20px;
            display: flex;
            justify-content: flex-end;
        }

        .modal-close {
            padding: 10px 25px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .modal-close:hover {
            background: #5a6fd6;
            transform: translateY(-1px);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📁 File Upload</h1>

        <div class="upload-area" id="uploadArea">
            <div class="upload-text">Click to upload files</div>
            <div class="upload-subtext">or drag and drop files here</div>
        </div>

        <input type="file" id="fileInput" multiple>

        <div id="statusMessage" class="status-message"></div>

        <div class="file-list">
            <h2>Uploaded Files</h2>
            <div id="fileListContainer">
                <div class="empty-state">No files uploaded yet</div>
            </div>
        </div>
    </div>

    <!-- Report Modal -->
    <div id="reportModal" class="modal-overlay">
        <div class="modal">
            <h2>🔍 Scan Report</h2>
            <div id="reportFilename" class="modal-filename"></div>
            <pre id="reportContent" class="report-content">Loading...</pre>
            <div class="modal-footer">
                <button class="modal-close" onclick="closeReport()">Close</button>
            </div>
        </div>
    </div>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const fileListContainer = document.getElementById('fileListContainer');
        const statusMessage = document.getElementById('statusMessage');

        uploadArea.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', (e) => handleFiles(e.target.files));

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('dragover'));

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            handleFiles(e.dataTransfer.files);
        });

        async function handleFiles(files) {
            const formData = new FormData();
            for (let file of files) {
                formData.append('files', file);
            }

            try {
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();

                if (response.ok) {
                    showStatus('Files uploaded successfully!', 'success');
                    loadUploadedFiles();
                } else {
                    showStatus(result.error || 'Upload failed', 'error');
                }
            } catch (error) {
                showStatus('Upload failed: ' + error.message, 'error');
            }

            fileInput.value = '';
        }

        async function loadUploadedFiles() {
            try {
                const response = await fetch('/files');
                const files = await response.json();
                displayFiles(files);
            } catch (error) {
                console.error('Error loading files:', error);
            }
        }

        function displayFiles(files) {
            if (files.length === 0) {
                fileListContainer.innerHTML = '<div class="empty-state">No files uploaded yet</div>';
                return;
            }

            fileListContainer.innerHTML = '';

            files.forEach((file) => {
                const fileItem = document.createElement('div');
                fileItem.className = 'file-item';

                const icon = getFileIcon(file.name);
                const size = formatFileSize(file.size);

                fileItem.innerHTML = `
                    <div class="file-info">
                        <div class="file-icon">${icon}</div>
                        <div class="file-details">
                            <div class="file-name">${file.name}</div>
                            <div class="file-size">${size}</div>
                        </div>
                    </div>
                    <div class="btn-group">
                        <button class="btn btn-report" onclick="viewReport('${file.name}')">Report</button>
                        <button class="btn btn-remove" onclick="removeFile('${file.name}')">Remove</button>
                    </div>
                `;

                fileListContainer.appendChild(fileItem);
            });
        }

        async function viewReport(filename) {
            const modal = document.getElementById('reportModal');
            const content = document.getElementById('reportContent');
            const filenameEl = document.getElementById('reportFilename');

            content.textContent = 'Loading...';
            filenameEl.textContent = filename;
            modal.classList.add('active');

            try {
                const response = await fetch(`/report/${encodeURIComponent(filename)}`);

                if (!response.ok) {
                    content.textContent = 'Report not found for this file.';
                    return;
                }

                content.textContent = await response.text();
            } catch (error) {
                content.textContent = 'Failed to load report: ' + error.message;
            }
        }

        function closeReport() {
            document.getElementById('reportModal').classList.remove('active');
            document.getElementById('reportContent').textContent = '';
            document.getElementById('reportFilename').textContent = '';
        }

        // Close modal on background click
        document.getElementById('reportModal').addEventListener('click', function(e) {
            if (e.target === this) closeReport();
        });

        async function removeFile(filename) {
            try {
                const response = await fetch(`/delete/${encodeURIComponent(filename)}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    showStatus('File deleted successfully', 'success');
                    loadUploadedFiles();
                } else {
                    showStatus('Failed to delete file', 'error');
                }
            } catch (error) {
                showStatus('Delete failed: ' + error.message, 'error');
            }
        }

        function getFileIcon(filename) {
            const ext = filename.split('.').pop().toLowerCase();
            const icons = {
                'pdf': '📄', 'doc': '📝', 'docx': '📝',
                'xls': '📊', 'xlsx': '📊',
                'jpg': '🖼️', 'jpeg': '🖼️', 'png': '🖼️', 'gif': '🖼️',
                'mp4': '🎬', 'avi': '🎬', 'mov': '🎬',
                'mp3': '🎵', 'wav': '🎵',
                'zip': '🗜️', 'rar': '🗜️',
                'txt': '📃', 'py': '🐍', 'csv': '📊'
            };
            return icons[ext] || '📎';
        }

        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
        }

        function showStatus(message, type) {
            statusMessage.textContent = message;
            statusMessage.className = `status-message ${type}`;
            statusMessage.style.display = 'block';
            setTimeout(() => { statusMessage.style.display = 'none'; }, 3000);
        }

        loadUploadedFiles();
    </script>
</body>
</html>
